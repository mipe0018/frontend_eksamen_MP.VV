
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test af Render API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    #events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .event {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #0001;
    }
  </style>
</head>
<body>
  <h1>Events fra vores API</h1>
  <p id="status">Henter events...</p>
  <div id="events"></div>

  <script>
    const API_URL =
      "https://backend-eksamen-mp-vv.onrender.com";

    async function loadEvents() {
      const status = document.querySelector("#status");
      const container = document.querySelector("#events");

      try {
        const response = await fetch(`${API_URL}/events`);

        if (!response.ok) {
          throw new Error(`HTTP-fejl: ${response.status}`);
        }

        const data = await response.json();
        const events = Array.isArray(data)
          ? data
          : data.events;

        if (!Array.isArray(events)) {
          throw new Error("Ukendt JSON-struktur");
        }

        status.textContent = `${events.length} events hentet`;

        events.forEach(event => {
          const card = document.createElement("article");
          card.className = "event";

          const title = document.createElement("h2");
          title.textContent = event.title ?? "Uden titel";

          const location = document.createElement("p");
          location.textContent =
            event.location ?? "Ingen lokation angivet";

          card.append(title, location);
          container.appendChild(card);
        });
      } catch (error) {
        status.textContent = "Kunne ikke hente events.";
        console.error(error);
      }
    }

    loadEvents();
  </script>
</body>
</html>
